<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market Quest · FIN42230 exam prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{
  --paper:#FAFAF6; --grid:rgba(47,85,212,.06); --ink:#1D2640; --muted:#5A6378; --rule:#D9DEEA;
  --pen:#2B4FCB; --pen-soft:#E7ECFB; --hl:#F6E571; --hl-ink:#3A3200; --card:#FFFFFF; --warn:#B4441F;
  --btn-ink:#fff; --good:#1F7A4D; --good-soft:#E3F4EA; --bad:#B4441F; --bad-soft:#FBE9E2; --amber:#D68C1E; --amber-soft:#FBF0DC;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141B; --grid:rgba(143,168,255,.05); --ink:#E5E8F0; --muted:#9AA3B8; --rule:#2A3142;
  --pen:#8FA8FF; --pen-soft:#1C2440; --hl:#4E4612; --hl-ink:#F7E98C; --card:#171B24; --warn:#F09272;
  --btn-ink:#0b1020; --good:#6FD3A0; --good-soft:#15291F; --bad:#F09272; --bad-soft:#2E1D17; --amber:#F0B450; --amber-soft:#2D2412;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141B; --grid:rgba(143,168,255,.05); --ink:#E5E8F0; --muted:#9AA3B8; --rule:#2A3142;
  --pen:#8FA8FF; --pen-soft:#1C2440; --hl:#4E4612; --hl-ink:#F7E98C; --card:#171B24; --warn:#F09272;
  --btn-ink:#0b1020; --good:#6FD3A0; --good-soft:#15291F; --bad:#F09272; --bad-soft:#2E1D17; --amber:#F0B450; --amber-soft:#2D2412;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.5rem;margin-bottom:6px} h3{font-size:1.15rem;margin:18px 0 6px}
p{margin:0 0 10px} ul,ol{margin:0 0 10px;padding-left:22px} li{margin-bottom:4px}
a{color:var(--pen)} button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.8rem}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--pen)}
.muted{color:var(--muted)}
/* top bar */
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.top .brand{font-family:var(--display);font-size:1.25rem;text-decoration:none;color:var(--ink);cursor:pointer}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:.78rem;border:1px solid var(--rule);background:var(--card);border-radius:99px;padding:3px 10px;white-space:nowrap}
.pill.hot{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.countdown{background:var(--pen-soft);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;margin-bottom:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.countdown b{font-family:var(--display);font-size:1.4rem;font-weight:400}
/* cards & buttons */
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.btn{display:inline-block;background:var(--pen);color:var(--btn-ink);border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:700;text-decoration:none}
.btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--pen);border:1.5px solid var(--pen)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn.warn{background:var(--warn);color:var(--btn-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
/* map */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lvl{background:var(--card);border:1.5px solid var(--rule);border-radius:14px;padding:14px;cursor:pointer;text-align:left;position:relative;display:block;width:100%}
.lvl{color:inherit;text-decoration:none}
.lvl:hover{border-color:var(--pen)}
.stage:hover{border-color:var(--pen)}
.lvl .n{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.lvl .t{font-family:var(--display);font-size:1.1rem;margin:2px 0 4px}
.lvl .e{font-size:1.6rem;float:right}
.lvl .st{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.7rem;border-radius:6px;padding:2px 7px;background:var(--pen-soft);color:var(--pen)}
.chip.ok{background:var(--good-soft);color:var(--good)} .chip.no{background:var(--rule);color:var(--muted)} .chip.hot{background:var(--amber-soft);color:var(--amber)}
.lvl.cleared{border-color:var(--good)}
.lvl.final{grid-column:1/-1;background:linear-gradient(135deg,var(--pen-soft),var(--card))}
.bar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pen);transition:width .3s}
.bar.good>i{background:var(--good)} .bar.boss>i{background:var(--bad)}
/* stages */
.stage{display:flex;gap:14px;align-items:center;background:var(--card);border:1.5px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.stage .ic{font-size:1.8rem}
.stage .tt{font-family:var(--display);font-size:1.1rem}
/* quiz */
.qbox{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px}
.qmeta{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;align-items:center}
.qtext{font-size:1.08rem;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt.right{background:var(--good-soft);border-color:var(--good)} .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:10px 14px;margin:10px 0;border-left:4px solid}
.fb.ok{background:var(--good-soft);border-color:var(--good)} .fb.no{background:var(--bad-soft);border-color:var(--bad)}
.numin{font:inherit;padding:9px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);width:160px}
.steps{background:var(--paper);border:1px dashed var(--rule);border-radius:10px;padding:10px 14px;margin:8px 0}
.steps ol{margin:4px 0 0}
/* lesson */
.lesson h2{margin-bottom:10px}
.tip{background:var(--hl);color:var(--hl-ink);border-radius:10px;padding:9px 14px;margin:12px 0}
.ex{background:var(--pen-soft);border-radius:10px;padding:9px 14px;margin:12px 0}
.formula{font-family:var(--mono);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:7px 12px;margin:8px 0;overflow-x:auto}
.note{border-left:3px dashed var(--warn);padding-left:10px;color:var(--muted);margin:10px 0}
table.t{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--rule);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--pen-soft)}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule)} .dots i.on{background:var(--pen)} .dots i.done{background:var(--good)}
/* boss */
.boss-hdr{background:linear-gradient(135deg,var(--bad-soft),var(--card));border:1.5px solid var(--bad);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.headline{font-family:var(--display);font-size:1.15rem;border-left:5px solid var(--ink);padding:6px 14px;margin:10px 0;background:var(--paper)}
.part{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.part .lab{font-family:var(--mono);color:var(--pen);font-weight:500}
textarea.ans{width:100%;min-height:130px;font:inherit;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical}
.model{background:var(--good-soft);border-radius:10px;padding:10px 14px;margin-top:10px}
.rub label{display:flex;gap:8px;align-items:flex-start;margin:5px 0;cursor:pointer}
.rub input{margin-top:5px}
.timer{font-family:var(--mono);font-size:1.1rem}
.timer.over{color:var(--bad)}
.sticky{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0;border-bottom:1px solid var(--rule);margin-bottom:12px}
/* svg */
svg.dg{width:100%;max-width:520px;height:auto;display:block;margin:10px auto;background:var(--card);border:1px solid var(--rule);border-radius:10px}
svg.dg text{fill:var(--ink);font-family:var(--body);font-size:12px}
svg.dg .ax{stroke:var(--ink);stroke-width:1.6;fill:none}
svg.dg .gd{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3;fill:none}
svg.dg .ln{stroke-width:2.4;fill:none;stroke-linecap:round}
svg.dg .c0{stroke:var(--pen)} svg.dg .c1{stroke:var(--amber)} svg.dg .c2{stroke:var(--bad)} svg.dg .c3{stroke:var(--good)} svg.dg .c4{stroke:var(--muted)}
svg.dg .f0{fill:var(--pen);fill-opacity:.25} svg.dg .f1{fill:var(--amber);fill-opacity:.3} svg.dg .f2{fill:var(--bad);fill-opacity:.35} svg.dg .f3{fill:var(--good);fill-opacity:.3}
svg.dg .pt{fill:var(--ink)}
svg.dg .small{font-size:10.5px;fill:var(--muted)}
svg.dg .nd{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
svg.dg .nd.hl{fill:var(--hl);}
svg.dg .es{stroke:var(--ink);stroke-width:3.2}
svg.dg .ew{stroke:var(--muted);stroke-width:1.8;stroke-dasharray:5 4}
svg.dg .ep{stroke:var(--good);stroke-width:2.4}
svg.dg .en{stroke:var(--bad);stroke-width:2.4;stroke-dasharray:5 4}
svg.dg .cell{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
svg.dg .cell.hl{fill:var(--hl)}
svg.dg .h{font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);justify-content:center}
img.slide{max-width:100%;border:1px solid var(--rule);border-radius:8px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:99px;font-size:.92rem;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.summary-big{font-family:var(--display);font-size:2.6rem}
.badge{display:inline-block;border:1px solid var(--rule);border-radius:10px;padding:6px 10px;margin:4px 4px 0 0;background:var(--card);font-size:.9rem}
.badge.off{opacity:.4;filter:grayscale(1)}
@media (max-width:520px){body{font-size:16px} h1{font-size:1.6rem}}

/* real-life layer */
.plain{background:var(--hl);color:var(--hl-ink);border-radius:10px;padding:9px 14px;margin:0 0 12px;font-size:1.04rem}
.story{background:var(--pen-soft);border-left:5px solid var(--pen);border-radius:10px;padding:10px 16px;margin:12px 0}
.story p{margin:.45em 0}
.simple{border:1.5px solid var(--rule);border-radius:10px;padding:10px 16px;margin:12px 0;background:var(--card)}
.simple ol{padding-left:1.2em} .simple li{margin:.5em 0}
details.full{margin:12px 0;border:1px dashed var(--rule);border-radius:10px;padding:8px 14px}
details.full summary{cursor:pointer;font-weight:700;color:var(--pen)}
.sh{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--pen);margin-bottom:4px}
.jargon{border:1px dashed var(--rule);border-radius:10px;padding:8px 14px;margin:12px 0;background:var(--paper)}
.jargon dl{margin:4px 0 2px;display:grid;grid-template-columns:max-content 1fr;gap:5px 14px}
.jargon dt{font-weight:700} .jargon dd{margin:0}
@media(max-width:520px){.jargon dl{grid-template-columns:1fr;gap:0}.jargon dd{margin-bottom:8px}}
.scn{background:var(--pen-soft);border-radius:10px;padding:9px 14px;margin-bottom:12px}
.hintbox{background:var(--hl);color:var(--hl-ink);border-radius:10px;padding:9px 14px;margin:8px 0}
.hintbox[hidden]{display:none}

svg.dg .grid{stroke:var(--rule);stroke-width:1;opacity:.7}
svg.dg .pv{font-weight:700;font-size:11px}
.eqs{font-family:var(--mono);font-size:.78rem;text-align:center;color:var(--muted);margin:-4px auto 10px;max-width:520px}
</style></head>
<body><div class="wrap"><div id="app">Loading…</div></div>
<script>const TOPICS=[];
const RL={lv:{},card:{}};
/* Diagram helpers: generic chart (axes + lines + shaded polygons + points), payoff matrix, network graph. All return SVG strings. */
const DG = (() => {
  const f = n => Math.round(n * 10) / 10;
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  // chart({xlabel,ylabel,xmax,ymax,lines:[{p:[[x,y]..],label,c,dash,lx,ly,anchor}],polys:[{p,c,label,lx,ly}],pts:[{x,y,label,g:'xy'|'x'|'y'|'',dx,dy,xt,yt}],texts:[{x,y,t,anchor}],xticks:[{v,t}],yticks:[{v,t}]})
  function chart(o) {
    const W = o.w || 460, H = o.h || 340, L = 78, R = 26, T = 16, B = 50;
    const xm = o.xmax || 10, ym = o.ymax || 10;
    const X = x => f(L + (W - L - R) * x / xm), Y = y => f(H - B - (H - T - B) * y / ym);
    const fmt = n => { const r = Math.round(n * 1000) / 1000; return String(r).replace('-', '−'); };
    const isP = /price|€/i.test(o.ylabel || 'Price'), cur = /€/.test(o.ylabel || '') ? '€' : '';
    const step = m => { for (const k of [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000]) if (m / k <= 9) return k; return 1000; };
    const pts = o.pts || [];
    const pxs = pts.filter(p => p.xt && (p.g == null ? 'xy' : p.g).includes('x')), pys = pts.filter(p => p.yt && (p.g == null ? 'xy' : p.g).includes('y'));
    let s = `<svg class="dg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.alt || 'economics diagram')}">`;
    // numeric axes: faint grid, tick marks and values (skipped where a labelled point already shows its own number)
    if (!o.xticks) for (let v = 0; v <= xm + 1e-9; v += step(xm)) {
      s += `<line class="grid" x1="${X(v)}" y1="${T}" x2="${X(v)}" y2="${H - B}"/>`;
      if (!pxs.some(p => Math.abs(X(p.x) - X(v)) < 34)) s += `<text x="${X(v)}" y="${H - B + 15}" text-anchor="middle" class="small">${fmt(v)}</text>`;
    }
    if (!o.yticks) for (let v = 0; v <= ym + 1e-9; v += step(ym)) {
      s += `<line class="grid" x1="${L}" y1="${Y(v)}" x2="${W - R}" y2="${Y(v)}"/>`;
      if (!pys.some(p => Math.abs(Y(p.y) - Y(v)) < 14)) s += `<text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" class="small">${cur}${fmt(v)}</text>`;
    }
    (o.polys || []).forEach(p => {
      s += `<polygon class="f${p.c || 0}" points="${p.p.map(q => X(q[0]) + ',' + Y(q[1])).join(' ')}"/>`;
      if (p.label) s += `<text x="${X(p.lx)}" y="${Y(p.ly)}" text-anchor="middle" class="h">${esc(p.label)}</text>`;
    });
    s += `<path class="ax" d="M${L} ${T - 4} V${H - B} H${W - R + 6}"/>`;
    s += `<text x="${(L + W - R) / 2}" y="${H - 5}" text-anchor="middle">${esc(o.xlabel || 'Quantity')}</text>`;
    s += `<text transform="translate(14 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">${esc(o.ylabel || 'Price')}</text>`;
    (o.xticks || []).forEach(t => s += `<text x="${X(t.v)}" y="${H - B + 15}" text-anchor="middle" class="small">${esc(t.t)}</text>`);
    (o.yticks || []).forEach(t => s += `<text x="${L - 6}" y="${Y(t.v) + 4}" text-anchor="end" class="small">${esc(t.t)}</text>`);
    const eqs = [];
    const xs = /firm|stall/i.test(o.xlabel || '') ? 'q' : 'Q';
    (o.lines || []).forEach(l => {
      s += `<polyline class="ln c${l.c || 0}" ${l.dash ? 'stroke-dasharray="6 4"' : ''} points="${l.p.map(q => X(q[0]) + ',' + Y(q[1])).join(' ')}"/>`;
      if (l.label) {
        const e = l.p[l.p.length - 1];
        const lx = l.lx != null ? l.lx : e[0], ly = l.ly != null ? l.ly : e[1];
        s += `<text x="${X(lx) + 5}" y="${Y(ly) + 4}" class="h" text-anchor="${l.anchor || 'start'}" style="fill:var(--${['pen', 'amber', 'bad', 'good', 'muted'][l.c || 0]})">${esc(l.label)}</text>`;
        // straight lines named D, S, MR... get their equation under the chart
        if (isP && o.eq !== false && l.p.length === 2 && /^(D|S|MR|D\d|S\d)\b/.test(l.label) && l.p[1][0] !== l.p[0][0]) {
          const m = (l.p[1][1] - l.p[0][1]) / (l.p[1][0] - l.p[0][0]), b = l.p[0][1] - m * l.p[0][0];
          const slope = Math.abs(m) === 1 ? xs : fmt(Math.abs(m)) + xs;
          let t = Math.abs(b) < 1e-9 ? (m < 0 ? '−' : '') + slope : fmt(b) + (m < 0 ? ' − ' : ' + ') + slope;
          if (Math.abs(m) < 1e-9) t = fmt(b);
          eqs.push(`${l.label.split(' ')[0]}: P = ${t}`);
        }
      }
    });
    // stagger neighbouring x-axis value labels onto a second row so they never collide
    const rowOf = new Map(), lastX = [-999, -999];
    pxs.slice().sort((a, b) => a.x - b.x).forEach(p => { let r = 0; while (r < 2 && X(p.x) - lastX[r] < 66) r++; r = Math.min(r, 1); lastX[r] = X(p.x); rowOf.set(p, r); });
    pts.forEach(p => {
      const g = p.g == null ? 'xy' : p.g;
      if (g.includes('x')) s += `<line class="gd" x1="${X(p.x)}" y1="${Y(p.y)}" x2="${X(p.x)}" y2="${H - B}"/>`;
      if (g.includes('y')) s += `<line class="gd" x1="${L}" y1="${Y(p.y)}" x2="${X(p.x)}" y2="${Y(p.y)}"/>`;
      s += `<circle class="pt" cx="${X(p.x)}" cy="${Y(p.y)}" r="3.6"/>`;
      if (p.label) s += `<text x="${X(p.x) + (p.dx != null ? p.dx : 7)}" y="${Y(p.y) + (p.dy != null ? p.dy : -7)}">${esc(p.label)}</text>`;
      const named = t => /=|≈|^[\d€.]|\d{2}|\d\.\d/.test(t);
      if (p.xt && g.includes('x')) s += `<text x="${X(p.x)}" y="${H - B + 15 + 12 * (rowOf.get(p) || 0)}" text-anchor="middle" class="pv">${esc(named(p.xt) ? p.xt : p.xt + ' = ' + fmt(p.x))}</text>`;
      if (p.yt && g.includes('y')) s += `<text x="${L - 6}" y="${Y(p.y) + 4}" text-anchor="end" class="pv">${esc(named(p.yt) ? p.yt : p.yt + ' = ' + cur + fmt(p.y))}</text>`;
    });
    (o.texts || []).forEach(t => s += `<text x="${X(t.x)}" y="${Y(t.y)}" text-anchor="${t.anchor || 'middle'}" ${t.cls ? `class="${t.cls}"` : ''}>${esc(t.t)}</text>`);
    s += '</svg>';
    return s + (eqs.length ? `<div class="eqs">${eqs.join(' &nbsp;·&nbsp; ')}</div>` : '') + (o.caption ? `<div class="eqs">${o.caption}</div>` : '');
  }
  // matrix({rowName,colName,rows:[..],cols:[..],cells:[[[a,b],..],..],hl:[[r,c]..],unit})
  function matrix(o) {
    const nr = o.rows.length, nc = o.cols.length, cw = 120, ch = 56, L = 96, T = 64, W = L + nc * cw + 16, H = T + nr * ch + 16;
    let s = `<svg class="dg" viewBox="0 0 ${W} ${H}" role="img" aria-label="payoff matrix">`;
    s += `<text x="${L + nc * cw / 2}" y="18" text-anchor="middle" class="h">${esc(o.colName)}</text>`;
    o.cols.forEach((c, j) => s += `<text x="${L + j * cw + cw / 2}" y="${T - 10}" text-anchor="middle">${esc(c)}</text>`);
    s += `<text x="8" y="${T + nr * ch / 2 - 6}" class="h">${esc(o.rowName)}</text>`;
    o.rows.forEach((r, i) => {
      s += `<text x="${L - 8}" y="${T + i * ch + ch / 2 + 4}" text-anchor="end">${esc(r)}</text>`;
      o.cols.forEach((c, j) => {
        const hl = (o.hl || []).some(h => h[0] === i && h[1] === j);
        const v = o.cells[i][j];
        s += `<rect class="cell${hl ? ' hl' : ''}" x="${L + j * cw}" y="${T + i * ch}" width="${cw}" height="${ch}"/>`;
        s += `<text x="${L + j * cw + cw / 2}" y="${T + i * ch + ch / 2 + 5}" text-anchor="middle" class="h" style="font-size:15px">${v == null ? '?' : esc(v[0]) + ' , ' + esc(v[1])}</text>`;

    });
    return s + '</svg>' + (o.note ? `<div class="legend">${o.note}</div>` : '');
  }
  // graph({nodes:{A:[x,y]},edges:[[a,b,'s'|'w'|'+'|'-'|'e']],hl:[names],w,h,legend:true,labels:{A:'text'}})
  function graph(o) {
    const W = o.w || 460, H = o.h || 300;
    const P = n => [f(30 + (W - 60) * o.nodes[n][0] / 100), f(26 + (H - 52) * o.nodes[n][1] / 100)];
    let s = `<svg class="dg" viewBox="0 0 ${W} ${H}" role="img" aria-label="network graph">`;
    o.edges.forEach(e => {
      const a = P(e[0]), b = P(e[1]), cls = { s: 'es', w: 'ew', '+': 'ep', '-': 'en', e: 'es' }[e[2] || 'e'];
      s += `<line class="${cls}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
      if (e[3]) s += `<text x="${(a[0] + b[0]) / 2 + 6}" y="${(a[1] + b[1]) / 2 - 4}" class="small">${esc(e[3])}</text>`;
    });
    Object.keys(o.nodes).forEach(n => {
      const p = P(n), hl = (o.hl || []).includes(n);
      s += `<circle class="nd${hl ? ' hl' : ''}" cx="${p[0]}" cy="${p[1]}" r="16"/><text x="${p[0]}" y="${p[1] + 4}" text-anchor="middle" class="h">${esc(n)}</text>`;
    });
    s += '</svg>';
    if (o.legend) {
      const kind = o.kind || 'tie';
      s += kind === 'tie' ? '<div class="legend"><span>━ strong tie</span><span>┅ weak tie</span></div>'
        : kind === 'sign' ? '<div class="legend"><span style="color:var(--good)">━ friends (+)</span><span style="color:var(--bad)">┅ enemies (−)</span></div>' : '';
    }
    return s;
  }
  return { chart, matrix, graph };
})();

TOPICS.push((() => {
  // ---- shared diagram pieces (cost curves: VC=q^3-6q^2+14q, FC=8) ----
  const pts = (fn, a, b, n) => { const o = []; for (let i = 0; i <= n; i++) { const x = a + (b - a) * i / n; o.push([x, fn(x)]); } return o; };
  const MC = q => 3 * q * q - 12 * q + 14, AVC = q => q * q - 6 * q + 14, AC = q => AVC(q) + 8 / q;
  const firm = (prices, extra) => DG.chart({

    pts: [{ x: 5, y: 7, label: 'E', xt: 'Q*', yt: 'P*' }]
  });
  const capD = () => DG.chart({
    xmax: 12, ymax: 14, xlabel: 'Number of rides', ylabel: 'Fare (€)', alt: 'licence cap diagram',
    polys: [{ p: [[0, 12], [0, 8], [4, 8]], c: 0, label: 'A', lx: 1.0, ly: 9.7 }, { p: [[0, 8], [4, 8], [4, 5], [0, 5]], c: 3, label: 'B', lx: 2, ly: 6.4 }, { p: [[4, 8], [4, 5], [7, 5]], c: 2, label: 'C', lx: 4.5, ly: 5.9 }],
    lines: [{ p: [[0, 12], [12, 0]], label: 'D', c: 0, lx: 11.3, ly: 0.9 }, { p: [[0, 5], [12, 5]], label: 'S1 (no cap)', c: 1, lx: 12, ly: 5, anchor: 'end' }, { p: [[4, 0], [4, 13]], label: 'S2 (cap)', c: 2, lx: 4, ly: 13.2 }],
    pts: [{ x: 7, y: 5, label: 'E1', xt: 'Q1', yt: 'p1' }, { x: 4, y: 8, label: 'E2', xt: 'Q2', yt: 'p2' }]
  });
  const marketFall = () => DG.chart({
    xmax: 10, ymax: 18, xlabel: 'Quantity (market)', ylabel: 'Price (€)', alt: 'demand falls',
    lines: [{ p: [[0, 2.5], [9, 11.5]], label: 'S', c: 1 }, { p: [[0.5, 17], [10, 7.5]], label: 'D1', c: 0, lx: 9.8, ly: 7.9 }, { p: [[0, 12.5], [10, 2.5]], label: 'D2', c: 2, lx: 9.6, ly: 2.9 }],
    pts: [{ x: 7.5, y: 10, label: 'E1', xt: 'Q1', yt: 'P1' }, { x: 5, y: 7.5, label: 'E2', xt: 'Q2', yt: 'P2' }]
  });

  return {
    id: 'comp', n: 4, emoji: '🏪', title: 'Perfect Competition', blurb: 'Five conditions, price takers, firm vs market, surplus, licence caps and market failure.',
    subs: { cond: 'The five conditions & price takers', pm: 'Profit maximisation & shutdown', shift: 'Demand shifts: firm vs market', cs: 'Consumer & producer surplus', cap: 'Restricting entry (taxi licences)', fail: 'Market failure' },
    cards: [
      {
        id: 'comp-c1', sub: 'cond', title: 'Why perfect competition is the "benchmark"',
        html: `<p>With many tiny identical sellers, <b>nobody controls the price</b>. That forces the market to produce exactly the welfare-maximising amount, so everything else (monopoly, cartels, platforms) is judged against it.</p>
        <p><b>The five conditions</b></p><ol><li>Large number of buyers and sellers</li><li>Identical (homogeneous) products</li><li>Full information for buyers and sellers</li><li>Negligible transaction costs</li><li>Free entry and exit</li></ol>
        <div class="ex"><b>Real life:</b> eBay is the favourite near-example: millions of buyers and sellers, super-low search and transaction costs. A wheat farmer is the classic case: you can't charge more than the going price because buyers will simply buy identical wheat from the next farmer.</div>
        <p>Each firm is a <b>price taker</b>: it faces a <b>horizontal</b> demand curve at the market price. So its extra revenue from one more unit (MR) <i>equals the price</i>: <b>P = MR</b>.</p>`,
        tip: 'Mock-style parts often start "discuss the key conditions…". List all five, then link each to price-taking with one sentence of explanation or an example. That is how you reach full marks.',
        check: { type: 'mcq', q: 'A single wheat farmer cannot raise her price above the market price because…', opts: ['she has a patent on her wheat', 'buyers can buy identical wheat from many other sellers at the market price', 'the government fixes the price', 'her costs are zero'], a: 1, why: 'Many sellers + identical product means any seller who charges more loses all her buyers. Her demand curve is horizontal at the market price.' }
      },
      {
        id: 'comp-c2', sub: 'pm', title: 'The firm: where to stop producing',
        html: `<p>Every firm, in any market, follows one rule: <b>if MR &gt; MC, make more; if MR &lt; MC, make less</b>. Profit is highest where <b>MR = MC</b>. A price taker has MR = P, so it produces where <b>P = MC</b>.</p>
        <div class="formula">Profit π = TR − TC     Price taker: MR = P → produce where P = MC</div>
        <p>Cost recap: <b>MC cuts AC and AVC at their lowest points</b> (new unit below the average pulls it down, above pulls it up). In the picture, at price €12 the firm produces about 3.8 units (where the dashed price line meets MC), and since that price is above AC, it earns a profit.</p>${firm([[12, 'P = MR', 3]], [{ x: 3.83, y: 12, label: 'q*', xt: 'q*', g: 'x' }])}
        <p><b>Shutdown rule (short run):</b> keep operating while <b>P ≥ AVC</b>: even at a loss, revenue covers variable costs and helps pay rent you owe anyway. If <b>P &lt; AVC</b>, shut down. In the long run, exit if P &lt; AC.</p>
        <div class="ex"><b>Café logic:</b> your café loses money after rent, but each coffee sells for more than the beans, milk and barista time. Closing today would make the loss <i>bigger</i> (you'd still owe the rent). You'd close only if each coffee failed to cover its own variable cost.</div>`,
        tip: 'A rise in fixed cost (rent) raises AC but NOT MC, so it does not change how much a profit-maximiser produces in the short run.',
        check: { type: 'mcq', q: 'A price-taking firm sells at €10. Its AVC at its best output is €8 and its AC is €11. In the short run it should…', opts: ['shut down immediately, because it makes a loss', 'keep producing, because P covers AVC', 'raise its price to €11', 'double its output regardless of MC'], a: 1, why: 'Loss per unit = 11 − 10 = €1, but P (10) ≥ AVC (8), so it covers variable costs and contributes €2 per unit towards fixed costs. Shutting down would lose the whole fixed cost. In the long run (P < AC) it would exit.' }
      },
      {
        id: 'comp-c3', sub: 'shift', title: 'Demand rises: market vs firm',
        html: `<p>The <b>market</b> has an upward supply curve and a downward demand curve. The <b>firm</b> just sees a flat price line. When market demand shifts <b>right</b> (D1 → D2):</p>${market(true)}
        <ol><li><b>Market:</b> price rises (P1 → P2) and quantity rises (Q1 → Q2).</li><li><b>Firm (short run):</b> its horizontal line moves up. It can't set prices, but it produces more (q1 → q2, where P = MC), and P2 &gt; AC so it earns <b>economic profit</b>.</li></ol>${firm([[7.5, 'P1', 4], [10, 'P2', 3]], [{ x: 3.35, y: 7.5, label: 'q1', xt: 'q1', g: 'x' }, { x: 3.63, y: 10, label: 'q2', xt: 'q2', g: 'x' }])}
        <p><b>Long run:</b> profit is a signal. New firms <b>enter</b>, market supply shifts right, price falls back until <b>P = minimum AC</b> and economic profit is zero again. A demand <i>fall</i> works in reverse: losses → exit → supply shifts left → price recovers.</p>
        <div class="note">Zero economic profit is not "bad": the owners earn exactly what they'd earn in their next-best use of their money and time, because that opportunity cost is already inside "cost".</div>`,
        tip: 'The exam wording: "compare the impact … for the case of the firm and the market". Draw TWO side-by-side panels (market left, firm right) and say what happens in the short run AND the long run.',
        check: { type: 'mcq', q: 'After a rise in demand in a perfectly competitive market, what brings the firm\'s economic profit back to zero in the long run?', opts: ['The government taxes the profit away', 'Entry of new firms shifts market supply right and pushes price back down to minimum AC', 'Existing firms raise their prices', 'Demand shifts back by itself'], a: 1, why: 'Free entry is the key condition: profits attract entrants, supply rises, price falls until P = min AC and there is no more reason to enter.' }
      },
      {
        id: 'comp-c4', sub: 'cs', title: 'Surplus: who gains from trade',
        html: `<p>The <b>demand curve</b> is willingness to pay (WTP); the <b>supply curve</b> is the lowest price sellers will accept (marginal cost).</p>
        <ul><li><b>Consumer surplus (CS)</b> = WTP − price paid = area <i>under demand, above price</i>.</li><li><b>Producer surplus (PS)</b> = price received − minimum acceptable = area <i>above supply, below price</i>. PS = revenue − variable cost.</li><li><b>Welfare = CS + PS.</b> <b>Deadweight loss (DWL)</b> = surplus that no one gets, from trades that should have happened but didn't.</li></ul>${csps()}
        <p>Here D: P = 12 − Q and S: P = 2 + Q, so E = (5, 7). With straight lines each area is a triangle: <b>CS = ½ × 5 × (12 − 7) = 12.5</b>, <b>PS = ½ × 5 × (7 − 2) = 12.5</b>, welfare = 25. Competition maximises welfare because <b>P = MC</b>: every unit worth more to a buyer than it costs to make gets produced.</p>
        <div class="formula">PS = π + FC   (so PS = profit only when fixed cost is zero)</div>
        <div class="note"><b>Trap:</b> "I bought three identical hats at €10 each because that's what each is worth to me" is false. The first hat was worth <i>more</i> than €10 (surplus); you buy until the marginal hat is worth about €10.</div>`,
        tip: '"Define the term producer surplus and use a diagram" = one sentence definition + shaded area labelled PS above S below P + a line saying PS = revenue − variable cost (= profit + fixed cost).',
        check: { type: 'num', q: 'Demand is Qd = 60 − 3P. At a price of €10, what is consumer surplus in euros? (Hint: find the choke price where Q = 0.)', ans: 150, calc: () => { const Q = 60 - 3 * 10, choke = 60 / 3; return 0.5 * Q * (choke - 10); }, why: 'At P = 10, Q = 30. Choke price (Q = 0) is 20. CS = ½ × 30 × (20 − 10) = 150.', steps: ['Q at P = 10: 60 − 30 = 30', 'Choke price: 60 ÷ 3 = 20', 'CS = ½ × base 30 × height (20 − 10) = 150'] }
      },
      {
        id: 'comp-c5', sub: 'cap', title: 'Capping the number of taxis',
        html: `<p>Suppose a city limits taxi licences. With free entry and identical firms, long-run supply is flat at minimum AC (S1). The cap makes supply vertical at the licence limit (S2): <b>fewer rides, higher fare</b>.</p>${capD()}
        <table class="t"><tr><th></th><th>No cap</th><th>Cap</th><th>Change</th></tr><tr><td>Consumer surplus</td><td>A + B + C</td><td>A</td><td>−B − C</td></tr><tr><td>Producer surplus</td><td>0</td><td>B</td><td>+B</td></tr><tr><td>Welfare</td><td>A + B + C</td><td>A + B</td><td>−C = DWL</td></tr></table>
        <p>Consumers lose B + C. Licence holders gain B, which is why medallions became valuable assets. Society loses C. <b>Uber</b> effectively broke these caps, which is why economists love it.</p>
        <p class="muted">Your lecture slide (taxi cap, Topic 2 Part 3, slide 16):</p><img class="slide" src="img/t2-comp-s16-taxi-cap.png" alt="Slide: effect of a restriction on number of cabs">`,
        tip: 'Always finish a cap/quota/tax diagram with: who gains, who loses, and the DWL triangle. Examiners award marks for the welfare accounting, not just the shifted curve.',
        check: { type: 'mcq', q: 'In the licence-cap diagram, the deadweight loss is…', opts: ['the rectangle B: money transferred to licence holders', 'the triangle C: trades that no longer happen although buyers value them above cost', 'area A: the remaining consumer surplus', 'the fall in price'], a: 1, why: 'B is a transfer (consumers → licence holders). C is lost for everybody: those rides would have been worth more than they cost, but are not provided.' }
      },
      {
        id: 'comp-c6', sub: 'fail', title: 'Market failure',
        html: `<p><b>Definition:</b> a market failure is when the market delivers <b>inefficient</b> production or consumption (welfare is not maximised), often because <b>price exceeds marginal cost</b>.</p>
        <table class="t"><tr><th>Cause</th><th>Example</th><th>Why it fails</th></tr>
        <tr><td>Market power</td><td>Monopoly, cartel (OPEC)</td><td>Output restricted so P &gt; MC</td></tr>
        <tr><td>Externalities</td><td>Factory pollution; vaccines</td><td>Costs/benefits fall on third parties: over- / under-production</td></tr>
        <tr><td>Public goods</td><td>Street lighting, defence</td><td>Free-riding: nobody can be excluded so the market under-supplies</td></tr>
        <tr><td>Asymmetric information</td><td>Used cars ("lemons")</td><td>Sellers know more than buyers; good cars leave the market</td></tr>
        <tr><td>Government restriction</td><td>Taxi caps, binding price controls</td><td>Fewer trades than efficient: DWL</td></tr></table>
        <div class="note">Externalities, public goods and information problems are standard textbook examples, not spelled out in your slides. Use them freely as "three examples".</div>`,
        tip: 'Definition (1–2 marks) + three examples each with ONE sentence on why it is a failure (about 1.5 marks each).',
        check: { type: 'mcq', q: 'Which of these is a market failure caused by an externality?', opts: ['A factory dumps waste in a river and does not pay for the damage', 'A shop raises prices after a supplier raises its cost', 'Tea gets cheaper when more tea is harvested', 'A café goes out of business because customers prefer another café'], a: 0, why: 'The factory\'s decisions impose a cost on third parties that it does not bear, so it overproduces relative to the social optimum. The other options are ordinary market responses.' }
      }
    ],
    questions: [
      { id: 'comp-q1', sub: 'cond', skip: true, type: 'mcq', q: 'Which scenario best describes a price taker?', opts: ['A pharmaceutical firm with a 20-year patent', 'A single potato farmer selling identical potatoes at a market with thousands of other farmers', 'Apple setting the price of a new iPhone', 'Ryanair deciding fares on a route where only easyJet competes'], a: 1, why: 'Many identical sellers means no individual seller can influence the price: the farmer faces a flat demand curve at the market price.' },
      { id: 'comp-q2', sub: 'cond', skip: true, type: 'mcq', q: 'Dublin has hundreds of sandwich shops, free entry and exit, but each shop\'s sandwiches are different (branding, recipes). Which condition of perfect competition is violated?', opts: ['Many buyers and sellers', 'Free entry and exit', 'Identical products', 'There is no condition violated: this is perfect competition'], a: 2, why: 'Differentiated products give each shop some pricing power (its own downward-sloping demand). This is monopolistic competition, not perfect competition.' },
      { id: 'comp-q3', sub: 'pm', skip: true, type: 'mcq', q: 'For a firm in perfect competition, marginal revenue is…', opts: ['equal to the market price', 'less than the market price', 'greater than the market price', 'zero in the short run'], a: 0, why: 'Selling one more unit does not force the price down on the others, so each extra unit earns exactly P: MR = P. (A monopolist is different: MR < P.)' },
      { id: 'comp-q4', sub: 'pm', skip: true, type: 'num', q: 'A price-taking firm has total cost TC = 50 + 2q + q². The market price is €14. How many units maximise its profit? (Use P = MC.)', ans: 6, calc: () => (14 - 2) / 2, why: 'MC = dTC/dq = 2 + 2q. Set P = MC: 14 = 2 + 2q → q = 6.', steps: ['MC = 2 + 2q', 'P = MC → 14 = 2 + 2q', 'q = 6'] },
      { id: 'comp-q5', sub: 'pm', skip: true, type: 'mcq', q: 'Same firm (TC = 50 + 2q + q², P = €14, produces q = 6). Its profit is −€14. What should it do in the SHORT run?', opts: ['Shut down, because profit is negative', 'Keep producing, because P (14) exceeds AVC (8)', 'Raise output until profit is positive', 'Exit the industry permanently'], a: 1, why: 'Revenue = 84; VC = 2·6 + 36 = 48, so AVC = 8 < P. Revenue covers all variable cost (84 − 48 = 36 towards the 50 fixed cost), so losing 14 is better than losing the full 50 by shutting down. Long run it would exit (P < AC = 16.3).' },
      { id: 'comp-q6', sub: 'shift', skip: true, type: 'mcq', q: 'Demand for a good in a perfectly competitive market rises. In the SHORT run a typical firm…', opts: ['earns zero economic profit', 'produces more and earns economic profit, because P rises above AC', 'produces less because the price is higher', 'cannot change output because it is a price taker'], a: 1, why: 'The firm takes the new higher price, expands to where P = MC, and with P > AC earns economic profit. Entry will erode it in the long run.' },
      { id: 'comp-q7', sub: 'shift', skip: true, type: 'mcq', q: 'In the long run, after the demand rise and entry of new firms in a constant-cost industry, price returns to…', opts: ['the original high price caused by the demand rise', 'minimum average cost, with zero economic profit', 'marginal cost of the least efficient firm', 'zero'], a: 1, why: 'Entry continues until economic profit is zero: P = min AC. In a constant-cost industry the long-run supply curve is flat at that level.' },
      { id: 'comp-q8', sub: 'cs', skip: true, type: 'num', q: 'Demand is Qd = 80 − 4P. The market price is €12. Calculate consumer surplus (€).', ans: 128, calc: () => 0.5 * (80 - 4 * 12) * (80 / 4 - 12), why: 'At P = 12, Q = 32. Choke price = 80/4 = 20. CS = ½ × 32 × (20 − 12) = 128.', steps: ['Q = 80 − 48 = 32', 'Choke price = 80 ÷ 4 = 20', 'CS = ½ × 32 × 8 = 128'] },
      { id: 'comp-q9', sub: 'cs', skip: true, type: 'tf', q: 'True or false (and why): a bakery has fixed costs of €500 and producer surplus of €800. Its profit is also €800.', a: false, why: 'False. PS = π + FC, so π = PS − FC = 800 − 500 = €300. Producer surplus equals profit only when fixed costs are zero.' },
      { id: 'comp-q10', sub: 'cap', skip: true, type: 'mcq', q: 'A city caps the number of taxi licences in a competitive market. Compared with no cap…', opts: ['fares fall and more rides are provided', 'fares rise, rides fall, licence holders gain and a deadweight loss appears', 'only consumers are affected, producers are unchanged', 'welfare rises because taxis are less congested'], a: 1, why: 'Supply restricted → higher price, lower quantity. Consumers lose; licence holders gain a transfer; the trades that no longer happen create DWL.' },

      { id: 'comp-q12', sub: 'cs', type: 'tf', q: 'True or false (and why): "I paid €25 for this concert ticket, so it is worth exactly €25 to me."', a: false, why: 'Almost certainly false. You buy if WTP ≥ price, so the ticket is worth at least €25 to you; the gap is your consumer surplus.' },

      { id: 'comp-q14', sub: 'pm', type: 'mcq', q: 'A price-taking firm\'s landlord raises the monthly rent (a fixed cost). In the SHORT run its profit-maximising output…', opts: ['rises, because it needs more revenue', 'falls, because costs are higher', 'is unchanged, because MC is unchanged', 'becomes zero'], a: 2, why: 'Fixed costs shift AC but not MC. The firm still produces where P = MC, so output is unchanged; profit just falls by the rent increase. (It would exit only if P fell below AVC, or in the long run below AC.)' },

TOPICS.push((() => {
  // Monopoly diagram: D: P=a-Q, MR=a-2Q, constant MC=c. Shows CS (blue), profit (amber), DWL (red).
  const mono = (a, c, o) => {
    o = o || {}; const qm = (a - c) / 2, pm = a - qm, qc = a - c;
    return DG.chart({
      xmax: a * 1.05, ymax: a * 1.08, xlabel: 'Quantity', ylabel: 'Price', alt: 'monopoly diagram',
      polys: [{ p: [[0, a], [0, pm], [qm, pm]], c: 0, label: 'CS', lx: qm * 0.3, ly: pm + (a - pm) * 0.3 }, { p: [[0, pm], [qm, pm], [qm, c], [0, c]], c: 1, label: 'Profit', lx: qm / 2, ly: (pm + c) / 2 }, { p: [[qm, pm], [qm, c], [qc, c]], c: 2, label: 'DWL', lx: qm + (qc - qm) * 0.25, ly: c + (pm - c) * 0.25 }],
      lines: [{ p: [[0, a], [a, 0]], label: 'D', c: 0, lx: a * 0.93, ly: a * 0.1 }, { p: [[0, a], [a / 2, 0]], label: 'MR', c: 3, lx: a / 2, ly: a * 0.04 }, { p: [[0, c], [a, c]], label: 'MC', c: 2, lx: a, ly: c, anchor: 'end' }],
      pts: [{ x: qm, y: pm, label: 'Em', xt: 'Qm', yt: 'Pm' }, { x: qc, y: c, label: 'Ec', xt: 'Qc', yt: 'Pc = MC', g: 'x', dx: 7, dy: -7 }].concat(o.extra || [])
    });
  };
  const cartel = () => {
    const pts = (fn, a, b, n) => { const r = []; for (let i = 0; i <= n; i++) { const x = a + (b - a) * i / n; r.push([x, fn(x)]); } return r; };
    return DG.chart({ xmax: 10, ymax: 12, w: 330, h: 300, xlabel: 'Market quantity', ylabel: 'Price', alt: 'cartel market', lines: [{ p: [[0, 11], [10, 1]], label: 'D', c: 0, lx: 9.5, ly: 1.7 }, { p: [[0, 11], [5.5, 0]], label: 'MR', c: 3, lx: 5.5, ly: 0.4 }, { p: [[0, 1], [10, 11]], label: 'S = ΣMC', c: 2, lx: 9.3, ly: 10.7 }], pts: [{ x: 5, y: 6, label: 'ec', xt: 'Qc', yt: 'pc', g: 'xy' }, { x: 3.3, y: 7.7, label: 'em', xt: 'Qm', yt: 'pm' }] })
      + DG.chart({ xmax: 10, ymax: 12, w: 330, h: 300, xlabel: 'One member\'s output', ylabel: 'Price / cost', alt: 'cartel member', lines: [{ p: pts(q => 1.5 + 0.05 * q * q + 0.5 * q, 0.2, 9.5, 30), label: 'MC', c: 2, lx: 9.5, ly: 10.9 }, { p: [[0, 6], [10, 6]], label: 'pc', c: 4, dash: true, lx: 10, ly: 6, anchor: 'end' }, { p: [[0, 7.7], [10, 7.7]], label: 'pm', c: 3, dash: true, lx: 10, ly: 7.7, anchor: 'end' }], pts: [{ x: 3.3, y: 7.7, label: '', xt: 'qm', g: 'x' }, { x: 5.1, y: 7.7, label: 'q*', xt: 'q*', g: 'x' }] });
  };

  return {
    id: 'imp', n: 5, emoji: '🏭', title: 'Imperfect Competition', blurb: 'Monopoly, welfare loss, HHI, monopolistic competition, oligopoly, cartels and OPEC.',
    subs: { mono: 'Monopoly: conditions & MR < P', welfare: 'Monopoly vs competition (CS, DWL)', hhi: 'Measuring concentration (HHI)', mc: 'Monopolistic competition', oligo: 'Oligopoly, Cournot & Bertrand', cartel: 'Cartels & OPEC' },
    cards: [
      {
        id: 'imp-c1', sub: 'mono', title: 'Monopoly: one seller who sets the price',
        html: `<p>Once a firm can influence its price, it produces <b>less</b> and charges <b>more</b> than a competitive market would. Market structures, most to least competitive: <b>perfect competition → monopolistic competition → oligopoly → monopoly</b>.</p>
        <p><b>Key conditions for a monopoly:</b></p><ol><li><b>One supplier</b> of the good.</li><li><b>Price maker</b>: faces the whole downward-sloping market demand curve.</li><li><b>Barriers to entry</b>: patents, licences, control of a key resource, huge set-up costs, network effects.</li><li><b>No close substitutes</b>.</li></ol>
        <div class="ex"><b>Natural monopoly:</b> economies of scale so large that one firm supplies the whole market more cheaply than two (water pipes, electricity grid, rail track). <b>Industrial monopoly:</b> power built through patents, acquisitions or licences (De Beers diamonds, Google Search, Microsoft).</div>`,
        tip: '"Using a suitable example, discuss the key conditions for a market to be a monopoly": give the four conditions, then tie EACH one to one real example (e.g. Irish Water pipes: single supplier, barrier = huge cost, no substitute for piped water).',
        check: { type: 'mcq', q: 'Which feature is most essential for a monopoly to KEEP earning above-normal profit in the long run?', opts: ['Many close substitutes', 'Barriers to entry', 'Free entry and exit', 'Zero fixed costs'], a: 1, why: 'Without barriers, profit attracts entrants and the monopoly disappears. Patents, licences, resource control, big sunk costs or network effects keep rivals out.' }
      },
      {
        id: 'imp-c2', sub: 'mono', title: 'Why MR is below price',
        html: `<p>A perfectly competitive firm sells every unit at the same market price, so MR = P. A monopolist faces the <b>whole</b> demand curve: to sell one more unit it must <b>cut the price on all units</b>. So <b>MR &lt; P</b>.</p>
        <div class="formula">Linear demand P = a − bQ  →  MR = a − 2bQ  (same intercept, twice as steep)</div>
        <p>The monopolist still follows the universal rule <b>MR = MC</b>, then reads the price off the <b>demand curve</b>. Example: D: P = 12 − Q → MR = 12 − 2Q. With MC = 2: 12 − 2Q = 2 → <b>Qm = 5</b>, Pm = 12 − 5 = <b>7</b> (not 2!). A competitive market would have P = MC = 2 and Qc = 10.</p>${mono(12, 2)}
        <p class="muted">Reading the diagram: blue = consumer surplus left, amber = monopoly profit (rectangle between Pm and MC up to Qm), red = deadweight loss.</p>
        <div class="note"><b>Deeper:</b> a monopolist never operates on the <i>inelastic</i> part of demand. There MR is negative: raising price would raise revenue <i>and</i> cut costs. It always ends up where demand is elastic (|e| &gt; 1). A monopolist also has no supply curve: output depends on the shape of demand.</div>`,
        tip: 'Method for ANY monopoly number question: (1) MR from demand, (2) MR = MC → Q, (3) put Q into DEMAND for price, (4) profit = (P − AC) × Q.',
        check: { type: 'num', q: 'A monopolist faces P = 50 − Q and has constant MC = 10. What price does it charge?', ans: 30, calc: () => { const Q = (50 - 10) / 2; return 50 - Q; }, why: 'MR = 50 − 2Q = 10 → Q = 20. Price from demand: P = 50 − 20 = 30.', steps: ['MR = 50 − 2Q', 'MR = MC: 50 − 2Q = 10 → Q = 20', 'P = 50 − 20 = 30 (read from demand, not from MC)'] }
      },
      {
        id: 'imp-c3', sub: 'welfare', title: 'Monopoly vs competition: surplus and DWL',
        html: `<p>This is a classic 10–20 mark answer. Compare the two market structures on the SAME demand and cost curves (the diagram above).</p>
        <table class="t"><tr><th></th><th>Perfect competition</th><th>Monopoly</th></tr><tr><td>Rule</td><td>P = MC</td><td>MR = MC, P &gt; MC</td></tr><tr><td>Quantity</td><td>Qc = 10</td><td>Qm = 5 (lower)</td></tr><tr><td>Price</td><td>Pc = 2</td><td>Pm = 7 (higher)</td></tr><tr><td>Consumer surplus</td><td>½ × 10 × 10 = 50</td><td>½ × 5 × 5 = 12.5</td></tr><tr><td>Profit / producer surplus</td><td>0 (constant MC)</td><td>5 × 5 = 25</td></tr><tr><td>Deadweight loss</td><td>0</td><td>½ × 5 × 5 = 12.5</td></tr></table>
        <p>Check: 50 = 12.5 + 25 + 12.5. Consumers lose 37.5: <b>25 is transferred to the firm</b> as profit and <b>12.5 is destroyed</b> (DWL). That's the market failure: units worth more to buyers than they cost to make go unproduced.</p>
        <p><b>Structure of a full-marks answer:</b> define CS → draw PC diagram and shade CS → draw monopoly diagram (D, MR, MC, Qm, Pm, Qc) and shade the smaller CS → say what happened to the lost surplus (transfer + DWL) → conclude monopoly is inefficient (P &gt; MC).</p>`,
        tip: 'Always say WHERE the lost consumer surplus went: part becomes monopoly profit (a transfer), part is deadweight loss (gone for everyone).',
        check: { type: 'num', q: 'Demand P = 40 − Q, constant MC = 10. Compute the monopoly deadweight loss.', ans: 112.5, calc: () => { const qm = 15, pm = 25, qc = 30; return 0.5 * (qc - qm) * (pm - 10); }, why: 'Monopoly: MR = 40 − 2Q = 10 → Qm = 15, Pm = 25. Competition: Qc = 30. DWL = ½ × (Qc − Qm) × (Pm − MC) = ½ × 15 × 15 = 112.5.', steps: ['Qm = 15, Pm = 25 (MR = MC)', 'Qc = 30 (P = MC)', 'DWL = ½ × 15 × 15 = 112.5'] }
      },
      {
        id: 'imp-c4', sub: 'hhi', title: 'Measuring concentration: HHI',
        html: `<div class="formula">HHI = s₁² + s₂² + … + sₙ²   (shares as decimals)</div>
        <ul><li>10 equal firms: 10 × 0.1² = <b>0.10</b>. Monopoly: 1² = <b>1</b>. Perfect competition → close to 0.</li><li>Squaring gives big firms extra weight. Two markets can both have a 4-firm share of 80% but different HHIs: (0.2, 0.2, 0.2, 0.2) → 0.16, but (0.65, 0.05, 0.05, 0.05) → 0.43.</li></ul>
        <div class="note">Often quoted in percentage units (0 to 10,000). A market over about 1,800 is "highly concentrated" under US merger guidelines. Regulators look hard at mergers that push HHI up sharply.</div>`,
        tip: 'A merger of two firms with shares a and b raises HHI by 2ab (decimals). Quick check for merger questions.',
        check: { type: 'num', q: 'Four firms have market shares 40%, 30%, 20% and 10%. What is the HHI (as a decimal)?', ans: 0.3, calc: () => 0.16 + 0.09 + 0.04 + 0.01, why: '0.4² + 0.3² + 0.2² + 0.1² = 0.16 + 0.09 + 0.04 + 0.01 = 0.30.', steps: ['0.40² = 0.16', '0.30² = 0.09', '0.20² = 0.04, 0.10² = 0.01', 'Sum = 0.30'] }
      },
      {
        id: 'imp-c5', sub: 'mc', title: 'Monopolistic competition',
        html: `<p><b>Many firms, differentiated products, free entry</b>: restaurants, cafés, hairdressers, shoe shops. Each firm faces its <i>own</i> downward-sloping (fairly elastic) demand.</p>
        <ul><li><b>Short run:</b> an attractive firm sets MR = MC like a mini-monopolist and earns profit.</li><li><b>Long run:</b> profit attracts entrants; each firm's demand shifts left until <b>profit = 0 (P = AC)</b>.</li><li><b>Not efficient</b> in either run: P &gt; MC and output is left of minimum AC (<b>excess capacity</b>). The trade-off is <b>variety</b>.</li><li><b>Limiting entry:</b> branding, advertising, loyalty schemes, prime locations, patents and secret recipes.</li></ul>
        <div class="ex">Dublin pizza: dozens of places, each different enough to charge a bit above cost. A new fancy pizzeria earns profit at first, then more open and the queue shrinks until profits vanish.</div>`,
        tip: 'Contrast table for the exam: PC (identical, P = MC, min AC) | Mono. comp. (differentiated, P > MC, excess capacity, zero LR profit) | Oligopoly (few firms, interdependence) | Monopoly (one firm, barriers).',
        check: { type: 'mcq', q: 'In the LONG run, a typical monopolistically competitive firm…', opts: ['earns positive economic profit because of product differentiation', 'earns zero economic profit and has excess capacity (P = AC, P > MC)', 'produces at minimum AC with P = MC', 'is a price taker'], a: 1, why: 'Free entry removes profit (P = AC), but differentiation means a downward-sloping demand so P > MC and the firm operates left of minimum AC.' }
      },
      {
        id: 'imp-c6', sub: 'oligo', title: 'Oligopoly: a few firms who watch each other',
        html: `<p><b>A few firms, limited entry</b>: Ryanair vs easyJet, Apple vs Samsung, Coke vs Pepsi, the Big Four auditors. Each firm's best move depends on its rivals (game theory next level!).</p>
        <ul><li><b>Collusion / cartel:</b> firms jointly fix price and output and act like one monopoly. Illegal in the EU, US, China, India.</li><li><b>Tacit collusion:</b> behave as if they had agreed, with no communication (petrol stations matching prices).</li><li><b>Cournot</b> = compete on quantity: price and quantity land between monopoly and perfect competition; more firms → closer to competition.</li><li><b>Bertrand</b> = compete on price with identical products: undercutting until <b>P = MC</b>. Two firms are enough for the competitive price (the "Bertrand paradox"). Real firms escape via differentiation, capacity limits or tacit collusion.</li></ul>
        <div class="note">Your slide only names Cournot and Bertrand; the predictions are the standard textbook ones.</div>`,
        tip: 'Oligopoly questions usually end in "…which is why we need game theory". Mention that the outcome depends on rivals\' reactions.',
        check: { type: 'mcq', q: 'Two firms sell identical products and compete by setting prices (Bertrand). What is the predicted equilibrium price?', opts: ['The monopoly price', 'Marginal cost', 'Halfway between monopoly price and MC', 'Zero'], a: 1, why: 'Each firm can steal the whole market by undercutting, so prices are driven down to P = MC. This is the Bertrand paradox: two firms suffice for competitive pricing.' }
      },
      {
        id: 'imp-c7', sub: 'cartel', title: 'Cartels and OPEC',
        html: `<p>A cartel acts like one monopolist: it picks the market quantity where <b>MR = MC</b> (Qm, pm) instead of the competitive Qc, pc. In the diagram each member must cut back from qc to its <b>quota qm</b> but now receives the higher price pm.</p>${cartel()}
        <p><b>Incentive to cheat:</b> at pm, a member's own MC curve says it would like to produce <b>q*</b> where pm = MC. Every unit between qm and q* sells for more than it costs. If everyone cheats, output rises, price falls, and the cartel collapses. It's a <b>prisoner's dilemma</b>.</p>
        <p><b>OPEC:</b> 12 members produce ~40% of world oil (OPEC+ ~50%) with monthly quotas. Saudi Arabia is the biggest producer and enforcer; it can flood the market to punish cheaters. Short-run oil demand is <b>inelastic</b>, so small output cuts produce large price rises, which makes the cartel worth keeping together.</p>
        <p class="muted">Your tutorial slide (Tutorial Topic 3, slide 2):</p><img class="slide" src="img/t3-tutorial-cartel.png" alt="Slide: perfect competition versus a cartel">`,
        tip: 'The "why cartels collapse" answer = P > MC for every member → each gains by secretly producing more → prisoner\'s dilemma. Repeated play (tit-for-tat punishment) explains why some hold.',
        check: { type: 'mcq', q: 'Why does OPEC succeed in raising revenue by cutting output (in the short run)?', opts: ['Oil demand is inelastic, so the price rises by more than quantity falls', 'Oil demand is perfectly elastic', 'Supply is perfectly elastic', 'OPEC members have no marginal cost'], a: 0, why: 'Inelastic demand: %ΔQ < %ΔP, so total revenue rises when quantity is cut and price jumps. That is why restricting output is profitable.' }

    ],
    questions: [

      { id: 'imp-q2', sub: 'mono', skip: true, type: 'mcq', q: 'A water utility with one set of pipes serves a whole city more cheaply than two competing networks could. This is an example of…', opts: ['an industrial monopoly built on a patent', 'a natural monopoly', 'monopolistic competition', 'a cartel'], a: 1, why: 'Huge economies of scale (fixed network cost) make one supplier cheapest: a natural monopoly (like electricity grids and rail track).' },

  const dist = (a, s) => { const d = { [s]: 0 }, q = [s]; while (q.length) { const u = q.shift(); (a[u] || []).forEach(v => { if (!(v in d)) { d[v] = d[u] + 1; q.push(v); } }); } return d; };

            model: '<ul><li><b>Definitions:</b> strong tie = close friend; weak tie = acquaintance.</li><li><b>Granovetter\'s finding:</b> jobs more often come via weak ties. Strong ties overlap in what they know (friends of friends are friends); weak ties connect you to <i>other</i> clusters with new information.</li><li><b>Bridges:</b> a local bridge joins two people with no common friends; deleting it makes them far apart. Such edges carry information across clusters.</li><li><b>STCP:</b> if A has strong ties to B and C, then B and C must be linked (strong or weak). Reason: triadic closure through opportunity, trust, incentive.</li><li><b>Link:</b> if every node satisfies STCP (with ≥ 2 strong ties), a local bridge can\'t be strong: a strong local bridge A–B would, with another strong tie A–C, force a B–C edge, so A and B would have a common friend. Hence local bridges are weak, and so the edges bringing in new information are weak ties.</li></ul>',

            model: '<ul><li><b>(i)</b> <b>D</b> has strong ties to E and F, but E–F is missing → violation. <b>F</b> has strong ties to D and G, but D–G is missing → violation. A is fine (strong ties B and C are linked by a weak tie). E and G have only one strong tie each.</li><li><b>(ii)</b> Add <b>E–F</b> (any tie) to fix D, and <b>D–G</b> to fix F. (Adding D–G creates new strong-pair checks: D would then have strong ties E, F and, if D–G is strong, G; keep it weak so no new violation arises.)</li><li><b>(iii)</b> <b>A–D</b> is the only link between the left cluster and the rest: a bridge, and a <b>weak</b> tie. It carries all information between the two clusters; so people in {A,B,C} get news from the other side only through this acquaintance link (Granovetter), and A and D have high betweenness.</li></ul>',

          },

    id: 'gt', n: 7, emoji: '♟️', title: 'Game Theory & Auctions', blurb: 'Key terms, assumptions, prisoner\'s dilemma, dominant strategies, Nash equilibrium, English/Dutch/sealed-bid auctions.',

      {
        id: 'gt-c1', sub: 'terms', title: 'When your best move depends on theirs',
        html: `<p>When your best move depends on what someone else does, you are playing a <b>game</b>. Game theory predicts what rational players do and why they often end up worse off.</p>
        <ul><li><b>Strategy:</b> a full battle plan. <b>Action</b> = one move. <b>Payoff</b> = profit, years in jail, utility.</li><li><b>Strategic interdependence:</b> my best strategy depends on yours.</li><li><b>Complete information:</b> payoffs are common knowledge. <b>Perfect information:</b> whoever moves knows the full history (chess yes, poker no).</li><li><b>Best response:</b> my payoff-maximising choice given what I believe you'll do.</li><li><b>Dominant strategy:</b> best response whatever the rivals do.</li><li><b>Nash equilibrium (NE):</b> strategies where nobody can gain by changing alone: mutual best responses.</li><li><b>Pure vs mixed:</b> pure = choose one action for sure; mixed = randomise with set probabilities.</li></ul>`,

        id: 'gt-c2', sub: 'assum', title: 'The standard assumptions of game theory',
        html: `<ol><li>Players are <b>rational</b> and payoffs are clear.</li><li>Each player <b>maximises their own payoff</b>.</li><li>The <b>rules of the game</b> are common knowledge.</li><li>Each player's payoff <b>depends on everyone's actions</b> (strategic interdependence).</li><li>Everyone <b>knows the payoffs</b>, knows that others know them, and so on (common knowledge).</li><li>Opponents are <b>payoff-maximisers too</b>.</li></ol>

        html: `<p>Two suspects (Tony, Junior) are questioned separately. Each chooses to confess or stay quiet:</p>${pd([[0, 0]])}
        <p><b>Reading it:</b> lower is better. Whatever Junior does, Tony serves fewer years by confessing (5 &lt; 10 if Junior confesses; 1 &lt; 2 if Junior is quiet). So <b>Confess is a dominant strategy</b> for both. The NE is (Confess, Confess) = 5 years each, even though both staying quiet would give just 2 each.</p>
        <p><b>Prisoner's dilemma:</b> everyone has a dominant strategy, and the outcome is worse for all than cooperating. Same structure: cartel cheating, price wars, doping in sport, advertising wars, tariff wars.</p>
        <div class="note"><b>Repeated games (not in your slides):</b> if players meet again and again, cooperation can survive because cheating today invites punishment tomorrow (tit-for-tat). That's partly why OPEC holds together at all.</div>`,

      {

        html: `<p><b>Best-response method:</b> for each column, mark the row player's best payoff; for each row, mark the column player's best payoff. Any cell with <b>both marked is a NE</b>.</p>
        <p>Pricing game (profits in €m):</p>${price([[1, 1]])}
        <p>If B charges High: A's best is Low (12 &gt; 8). If B charges Low: A's best is Low (4 &gt; 1). So Low is dominant for A, and by symmetry for B. <b>NE = (Low, Low)</b> with 4 each, while (High, High) would give 8 each: a prisoner's dilemma.</p>
        <p><b>Deeper</b></p><ul><li>A NE <b>doesn't need</b> dominant strategies. In a <b>coordination game</b> (both drive on the left or both on the right) there are <b>two NE</b> and no dominant strategy.</li><li>If there is <b>no pure NE</b> (penalty kicks, matching pennies), players randomise: a <b>mixed-strategy NE</b>. Choose your probabilities so your opponent is indifferent between their options.</li></ul>`,

        <tr><td><b>Sealed-bid, first-price</b></td><td>Secret simultaneous bids. Highest bid wins and pays its own bid.</td><td>Government contracts</td></tr>

      {

        html: `<ul><li><b>First-price sealed bid:</b> <b>shade</b> your bid below your value. Bid your exact value and winning gives zero surplus.</li><li><b>Second-price sealed bid:</b> <b>bid your true value</b> (weakly dominant). Your bid decides <i>whether</i> you win, never <i>what you pay</i>. Value €100: bid €120 vs a rival's €110 → you win and pay €110: a €10 loss. Bid €90 → you might lose an item you'd have got for less than €100.</li><li><b>Winner's curse</b> (common value): the winner is whoever overestimated most, so they tend to overpay. More bidders → worse, so bid more cautiously.</li></ul>

RL.lv.firms.extraCards = [{
  after: 'firms-c4',
  card: (() => {
    const FC = 8, VC = q => q ** 3 - 6 * q ** 2 + 14 * q, MCf = q => 3 * q * q - 12 * q + 14, ACf = q => q * q - 6 * q + 14 + FC / q;
    const f1 = n => (Math.round(n * 100) / 100).toString();
    const rows = [1, 2, 3, 4, 5, 6].map(q => ({ q, vc: VC(q), tc: VC(q) + FC, mc: VC(q) - VC(q - 1), ac: (VC(q) + FC) / q }));
    const best = rows.reduce((a, b) => (b.ac < a.ac ? b : a));
    const pts = (fn, a, b, n) => { const o = []; for (let i = 0; i <= n; i++) { const x = a + (b - a) * i / n; o.push([x, fn(x)]); } return o; };
    const chart = () => DG.chart({
      xmax: 7, ymax: 24, xlabel: 'Output (batches of 10 cups per hour)', ylabel: 'Cost per batch (€)', alt: 'U-shaped MC and AC with numbers',
      lines: [{ p: pts(MCf, 0.2, 4.7, 40), label: 'MC', c: 2, lx: 4.7, ly: MCf(4.7) }, { p: pts(ACf, 0.7, 5.6, 40), label: 'AC', c: 0, lx: 5.6, ly: ACf(5.6) }],
      pts: [{ x: 3.3, y: ACf(3.3), label: '', xt: '3.3', yt: '€7.51', g: 'xy' }],
      caption: 'Table values: MC (€) 9 → 3 → 3 → 9 → 21 → 39 &nbsp;·&nbsp; AC (€) 17 → 10 → 7.67 → 8 → 10.6 → 15.3.<br>The curves are the smooth version of the same table. The lowest point of AC is at about 3.3 batches (€7.51), exactly where MC crosses it.'
    });
    const table = `<table class="t"><tr><th>Batches q</th><th>Variable cost</th><th>Total cost (FC = €8)</th><th>MC (extra cost of this batch)</th><th>AC (TC ÷ q)</th></tr>${rows.map(r => `<tr><td>${r.q}</td><td>€${r.vc}</td><td>€${r.tc}</td><td><b>€${r.mc}</b></td><td>€${f1(r.ac)}</td></tr>`).join('')}</table>`;
    const wtp = `<table class="t"><tr><th>Friend</th><th>Most they would pay for a gig ticket</th><th>If the price is €40, do they buy?</th></tr><tr><td>Ana</td><td>€50</td><td>yes</td></tr><tr><td>Ben</td><td>€45</td><td>yes</td></tr><tr><td>Cal</td><td>€40</td><td>yes</td></tr><tr><td>Dee</td><td>€35</td><td>no</td></tr><tr><td>Eli</td><td>€30</td><td>no</td></tr></table>`;
    return {
      id: 'firms-c4b', sub: 'mcac', title: 'Why are cost curves U-shaped (but demand and supply straight)?',
      html: `<p><b>Maya\'s cart in real numbers.</b> Output is in batches of 10 cups an hour. Her fixed cost is €8 an hour, and the extra (variable) cost of each batch is below.</p>${table}
        <p>Look at the <b>MC column</b>: €9, €3, €3, €9, €21, €39. It <b>falls first</b> (Maya alone is slow at everything; with a second and third person each does one job, so extra batches are cheap), then <b>rises</b> (the cart is tiny, people queue for the one machine, overtime kicks in). That is diminishing returns.</p>
        <p>Now the <b>AC column</b>: €17, €10, €7.67, €8, €10.6, €15.3. Two forces fight:</p>
        <ul><li><b>Pulling AC down:</b> the €8 fixed cost is shared across more cups (€8 ÷ 1 = €8, but €8 ÷ 4 = €2 per batch). And while MC is below AC, each new batch is cheaper than the average, so the average falls.</li><li><b>Pushing AC up:</b> once MC climbs above AC (from the 4th batch on, MC €9 &gt; AC €7.67), every new batch drags the average up.</li></ul>
        <p>That tug-of-war is what makes the average cost curve a <b>U</b>, with its bottom (about €${f1(best.ac)} at 3 batches here) exactly where MC crosses AC.</p>${chart()}
        <p><b>So why are demand and supply lines straight?</b> They mostly aren\'t. Straight lines are a <b>simplification</b> so that the maths stays easy (one slope, one intercept). Real curves are curved. Two good reasons they look like downward lines anyway:</p>
        <ul><li><b>Demand</b> adds up lots of different people, each with their own "most I would pay". Line up five friends and you get a staircase; with thousands of people the steps blur into a smooth downward line.</li></ul>${wtp}
        <ul><li><b>Supply</b> is built from many firms\' marginal cost curves (a firm\'s supply curve is its MC curve above AVC). Each of those curves is U-shaped at the bottom and rises steeply at the top, so the market supply line slopes upward too. We draw it straight to keep the maths simple.</li></ul>
        <div class="note">The key difference: <b>demand and supply describe a whole market</b> (many people, one price). <b>AC and MC describe one firm</b> producing more and more with a fixed setup (cart, kitchen, machine). One firm\'s costs have a U-shape because of fixed costs and diminishing returns; a whole market doesn\'t need one.</div>`,

    html: `<p>Dev launches "QuickBite", a food-delivery app in a small town. He faces an awkward problem on day one.</p>
      <p>Restaurants say, <i>"We\'ll join when there are customers."</i> Customers say, <i>"We\'ll download it when there are restaurants."</i> Each side waits for the other. This is the <b>chicken-and-egg problem</b>.</p>
      <p>Dev solves it by giving customers €10 off their first order (subsidising one side), and signing up the three best-known restaurants for free. Soon more people want the app, so more restaurants want to be on it, which draws more customers: a <b>virtuous circle</b> called <b>network effects</b>.</p>
      <p>How does he earn money? Not from the side he subsidised. QuickBite charges restaurants a commission on each order. He may even lose money on customers and make it back from restaurants. Normal shops never price below cost for long; platforms do, because customers are worth more as a <b>magnet</b> than as a source of profit.</p>
      <p>And will the first big platform win forever? Friendster was early, MySpace overtook it, and Facebook overtook MySpace. Being first isn\'t enough.</p>`,
